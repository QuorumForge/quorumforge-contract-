name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test + wasm-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --check

      - name: clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: test
        run: cargo test

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Build optimized wasm
        run: stellar contract build --optimize

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: quorumforge-contract-wasm
          path: target/wasm32v1-none/release/quorumforge_contract.wasm
          retention-days: 30
